<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan AI</title><style>body{visibility:hidden;margin:0;background:#020617;color:#e2e8f0;font:14px system-ui}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.p{border:1px solid #334155;border-radius:12px;padding:14px}.i{width:100%;box-sizing:border-box;margin:7px 0;padding:9px;border-radius:8px;border:1px solid #334155;background:#020617;color:#fff}.b{padding:8px 11px;border:0;border-radius:8px;background:#4f46e5;color:#fff;cursor:pointer}.s{color:#94a3b8;font-size:12px}.ok{color:#86efac}.bad{color:#fca5a5}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap}</style><script>(async()=>{try{const r=await fetch('./api/admin-session',{credentials:'include',cache:'no-store'});const s=r.ok?await r.json():null;if(!s?.authenticated||!['ADMIN','SUPER_ADMIN'].includes(s.role)){location.replace('./admin-login.html');return}document.documentElement.dataset.admin='true';document.body.style.visibility='visible'}catch{location.replace('./admin-login.html')}})();</script></head><body><div class="wrap"><h2>⚙️ Pengaturan AI</h2><div class="s">Konfigurasi disimpan server-side dan API key tidak dikirim kembali ke browser.</div><div id="grid" class="grid"></div><div class="card"><div class="row"><b>Provider default</b><select id="def" class="i" style="width:240px"></select></div><div class="actions"><button class="b" onclick="loadConfig()">↻ Muat</button><button class="b" onclick="detect()">🔎 Test server</button><button class="b" onclick="save()">💾 Simpan</button><button class="b" onclick="clearAll()">Hapus konfigurasi</button></div><div id="msg" class="s"></div></div></div><script>const P=[['gemini','Google Gemini','gemini-2.5-flash'],['groq','Groq','llama-3.3-70b-versatile'],['openrouter','OpenRouter','openrouter/free'],['huggingface','Hugging Face','meta-llama/Llama-3.1-8B-Instruct'],['mistral','Mistral','mistral-small-latest']];let state={defaultProvider:'gemini',providers:{}};const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');function render(){grid.innerHTML=P.map(x=>{const s=state.providers[x[0]]||{};return `<div class="p"><div class="row"><b>${x[1]}</b><span id="b-${x[0]}" class="${s.configured?'ok':''}">${s.configured?'● Configured':'○ Not configured'}</span></div><div class="s">${esc(s.model||x[2])}</div><input id="k-${x[0]}" class="i" type="password" placeholder="API key baru (kosong = pertahankan)"><input id="m-${x[0]}" class="i" value="${esc(s.model||x[2])}"><div class="actions"><button class="b" onclick="test('${x[0]}')">Test</button></div><div id="s-${x[0]}" class="s">${s.key||'Key tersimpan server-side.'}</div></div>`}).join('');def.innerHTML=P.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');def.value=state.defaultProvider||'gemini'}async function loadConfig(){msg.textContent='Memuat…';try{const r=await fetch('./api/ai-config',{credentials:'include',cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Gagal memuat');state=d.config||state;render();msg.textContent='Konfigurasi server berhasil dimuat.'}catch(e){msg.textContent=e.message}}function collect(){const providers={};P.forEach(x=>{const current=state.providers[x[0]]||{};providers[x[0]]={model:document.getElementById('m-'+x[0]).value.trim()||x[2]};const key=document.getElementById('k-'+x[0]).value.trim();if(key)providers[x[0]].key=key});return {defaultProvider:def.value,providers}}async function save(){msg.textContent='Menyimpan…';try{const r=await fetch('./api/ai-config',{method:'PUT',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify(collect())});const d=await r.json();if(!r.ok)throw Error(d.error||'Gagal menyimpan');state=d.config;render();msg.textContent='Tersimpan server-side.';window.parent.postMessage({type:'meeting-ai-settings-updated'},location.origin)}catch(e){msg.textContent=e.message}}async function test(id){const key=document.getElementById('k-'+id).value.trim();if(key){await save();}const out=document.getElementById('s-'+id);out.textContent='Menguji di server…';try{const r=await fetch('./api/ai-runtime',{credentials:'include',cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'FAIL');if(d.provider!==id)throw Error('Provider aktif: '+d.provider);out.textContent=d.healthy?'PASS — HTTP '+d.status+' · server-side':'FAIL — HTTP '+d.status;document.getElementById('b-'+id).className=d.healthy?'ok':'bad';document.getElementById('b-'+id).textContent=d.healthy?'● Healthy':'● Failed'}catch(e){out.textContent='FAIL — '+e.message;document.getElementById('b-'+id).className='bad'}}async function detect(){await save();let good=[];for(const x of P){const r=await fetch('./api/ai-runtime',{credentials:'include',cache:'no-store'});const d=await r.json();if(d.healthy&&d.provider===x[0])good.push(x[0])}msg.textContent=good.length?'Provider aktif sehat: '+good.join(', '):'Tidak ada provider sehat.'}async function clearAll(){if(!confirm('Hapus seluruh konfigurasi AI server-side?'))return;const r=await fetch('./api/ai-config',{method:'DELETE',credentials:'include'});if(!r.ok){msg.textContent='Gagal menghapus.';return}state={defaultProvider:'gemini',providers:{}};render();msg.textContent='Konfigurasi dihapus dari server.'}loadConfig();</script></body></html>
