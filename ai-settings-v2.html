<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan AI</title><style>body{visibility:hidden;margin:0;background:#020617;color:#e2e8f0;font:14px system-ui}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.p{border:1px solid #334155;border-radius:12px;padding:14px}.i{width:100%;box-sizing:border-box;margin:7px 0;padding:9px;border-radius:8px;border:1px solid #334155;background:#020617;color:#fff}.b{padding:8px 11px;border:0;border-radius:8px;background:#4f46e5;color:#fff;cursor:pointer}.s{color:#94a3b8;font-size:12px}.ok{color:#86efac}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap}</style><script>(async()=>{try{const r=await fetch('./api/admin-session',{credentials:'include',cache:'no-store'});const s=r.ok?await r.json():null;if(!s?.authenticated||!['ADMIN','SUPER_ADMIN'].includes(s.role)){location.replace('./admin-login.html');return}document.documentElement.dataset.admin='true';document.body.style.visibility='visible'}catch{location.replace('./admin-login.html')}})();</script></head><body><div class="wrap"><h2>⚙️ Pengaturan AI</h2><div class="s">Provider yang berhasil diuji akan langsung dikenali aplikasi utama.</div><div class="card"><b>Google Gemini</b> dan provider fallback dapat dikonfigurasi di bawah. API key tidak dibuat atau diambil otomatis dari internet.</div><div id="grid" class="grid"></div><div class="card"><div class="row"><b>Provider default</b><select id="def" class="i" style="width:240px"></select></div><div class="actions"><button class="b" onclick="detect()">🔎 Deteksi & Test</button><button class="b" onclick="save()">💾 Simpan</button><button class="b" onclick="clearAll()">Hapus konfigurasi</button></div><div id="msg" class="s"></div></div></div><script>const P=[['gemini','Google Gemini','gemini-2.5-flash','https://generativelanguage.googleapis.com/v1beta/models'],['groq','Groq','llama-3.3-70b-versatile','https://api.groq.com/openai/v1/models'],['openrouter','OpenRouter','openrouter/free','https://openrouter.ai/api/v1/models'],['huggingface','Hugging Face','meta-llama/Llama-3.1-8B-Instruct','https://api-inference.huggingface.co/models'],['mistral','Mistral','mistral-small-latest','https://api.mistral.ai/v1/models']];const K='meeting_ai_provider_settings_v1',H='meeting_ai_provider_health_v1';const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}};function notify(){try{window.parent.postMessage({type:'meeting-ai-settings-updated'},location.origin)}catch(e){}try{window.top.postMessage({type:'meeting-ai-settings-updated'},location.origin)}catch(e){}}function render(){const c=rd(K),h=rd(H);grid.innerHTML=P.map(x=>{const s=c[x[0]]||{},ok=h[x[0]]?.healthy;return `<div class="p"><div class="row"><b>${x[1]}</b><span id="b-${x[0]}" class="${ok?'ok':''}">${ok?'● Healthy':'○ Not tested'}</span></div><div class="s">${x[2]}</div><input id="k-${x[0]}" class="i" type="password" placeholder="API key" value="${String(s.key||'').replace(/&/g,'&amp;').replace(/\"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}"><input id="m-${x[0]}" class="i" value="${s.model||x[2]}"><div class="actions"><button class="b" onclick="test('${x[0]}')">Test</button></div><div id="s-${x[0]}" class="s">${ok?'Tervalidasi.':'Belum diuji.'}</div></div>`}).join('');def.innerHTML=P.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');def.value=c.defaultProvider||'gemini'}function collect(){const o={defaultProvider:def.value};P.forEach(x=>o[x[0]]={key:document.getElementById('k-'+x[0]).value.trim(),model:document.getElementById('m-'+x[0]).value.trim()||x[2]});return o}function save(){localStorage.setItem(K,JSON.stringify(collect()));notify();msg.textContent='Tersimpan. Aplikasi utama akan membaca konfigurasi ini.'}function clearAll(){localStorage.removeItem(K);localStorage.removeItem(H);render();notify();msg.textContent='Konfigurasi dihapus.'}async function test(id){const x=P.find(a=>a[0]===id),key=document.getElementById('k-'+id).value.trim();if(!key){document.getElementById('s-'+id).textContent='API key belum diisi.';return false}document.getElementById('s-'+id).textContent='Menguji…';try{const r=id==='gemini'?await fetch(x[3]+'?key='+encodeURIComponent(key)):await fetch(x[3],{headers:{Authorization:'Bearer '+key}});if(!r.ok)throw Error('HTTP '+r.status);const h=rd(H);h[id]={healthy:true,checkedAt:new Date().toISOString()};localStorage.setItem(H,JSON.stringify(h));save();document.getElementById('b-'+id).textContent='● Healthy';document.getElementById('b-'+id).className='ok';document.getElementById('s-'+id).textContent='PASS — provider merespons.';notify();return true}catch(e){const h=rd(H);delete h[id];localStorage.setItem(H,JSON.stringify(h));notify();document.getElementById('s-'+id).textContent='FAIL — '+e.message;return false}}async function detect(){save();let good=[];for(const x of P){if(document.getElementById('k-'+x[0]).value.trim()&&await test(x[0]))good.push(x[0])}if(good.length){def.value=good.includes('gemini')?'gemini':good[0];save();msg.textContent='Provider sehat: '+good.join(', ')}else msg.textContent='Tidak ada provider yang PASS.'}render();</script></body></html>
