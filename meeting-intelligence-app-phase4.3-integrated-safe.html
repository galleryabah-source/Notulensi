<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meeting Intelligence Ultimate — Phase 4.3 Integrated Safe</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}
#appFrame{display:block;width:100%;height:100%;border:0;background:#020617}
#bootStatus{position:fixed;right:14px;bottom:14px;z-index:9999;background:#0f172a;color:#cbd5e1;border:1px solid #334155;border-radius:10px;padding:8px 11px;font:12px system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="bootStatus">Memuat baseline…</div>
<iframe id="appFrame" title="Meeting Intelligence Ultimate"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('appFrame');
  const status=document.getElementById('bootStatus');
  const base='./meeting-intelligence-app-phase4.2-document-versioning-traceability.html';
  const runtimeFiles=['./phase4.2-runtime-fix.js','./phase4.3-document-pack-addon.js'];
  function setStatus(text,hide){status.textContent=text;status.style.display=hide?'none':'block';}
  function absoluteUrl(path){return new URL(path,window.location.href).href;}
  async function loadBaseline(){
    const response=await fetch(base,{cache:'no-store'});
    if(!response.ok)throw new Error('Baseline HTTP '+response.status);
    let html=await response.text();
    const broken='<script src="https://cdn.tailwindcss.com">';
    const fixed='<script src="https://cdn.tailwindcss.com"></script><script>';
    if(html.includes(broken))html=html.replace(broken,fixed);
    frame.srcdoc=html;
  }
  function inject(path){
    return new Promise(function(resolve,reject){
      const doc=frame.contentDocument;
      if(!doc||!doc.head)return reject(new Error('iframe document belum siap'));
      const url=absoluteUrl(path);
      const old=doc.querySelector('script[data-phase-runtime="'+url+'"]');
      if(old)return resolve();
      const s=doc.createElement('script');s.src=url;s.async=false;s.dataset.phaseRuntime=url;
      s.onload=resolve;s.onerror=function(){reject(new Error('Gagal memuat '+path));};doc.head.appendChild(s);
    });
  }
  frame.addEventListener('load',async function(){
    try{
      setStatus('Baseline diperbaiki — mengaktifkan Phase 4.2…');
      await inject(runtimeFiles[0]);
      setStatus('Phase 4.2 aktif — mengaktifkan Phase 4.3…');
      await inject(runtimeFiles[1]);
      setStatus('Meeting Intelligence Ultimate siap.',true);
    }catch(e){console.error(e);setStatus('Bootstrap Phase 4 gagal: '+e.message);}
  },{once:true});
  (async function(){try{setStatus('Memuat dan memeriksa baseline…');await loadBaseline();}catch(e){console.error(e);setStatus('Bootstrap baseline gagal: '+e.message);}})();
})();
</script>
</body>
</html>
