<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notulensi Lite — Rekam & Transkrip</title><meta name="description" content="Notulensi Lite untuk merekam dan mentranskrip tanpa AI."><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;font-size:24px}.muted{color:#667085}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px rgba(16,24,40,.05)}button{font:inherit;border:0;border-radius:11px;padding:11px 16px;cursor:pointer}.primary{background:#172033;color:#fff}.secondary{background:#eef2f6;color:#172033}.danger{background:#fee4e2;color:#b42318}.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dot{width:10px;height:10px;border-radius:50%;background:#98a2b3;display:inline-block}.dot.live{background:#d92d20}.timer{font-variant-numeric:tabular-nums;font-size:38px;font-weight:800;margin:18px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field input,.field textarea{font:inherit;border:1px solid #d0d5dd;border-radius:10px;padding:11px}.field textarea{min-height:300px;resize:vertical}.transcript{white-space:pre-wrap;line-height:1.65;min-height:240px}.notice{padding:10px 12px;border-radius:10px;background:#f2f4f7}.history-item{border-top:1px solid #eaecf0;padding:12px 0}.hidden{display:none}@media(max-width:650px){.shell{padding:14px}.top{align-items:flex-start;gap:12px}.timer{font-size:32px}}</style></head><body><div class="shell"><header class="top"><div><div class="brand">Notulensi Lite</div><div class="muted">Rekam & Transkrip — tanpa AI</div></div><a href="/admin-login.html?next=%2Fadmin-settings.html">Admin</a></header><section class="card"><div class="status"><span id="dot" class="dot"></span><strong id="status">Siap merekam</strong><span id="support" class="muted"></span></div><div id="timer" class="timer">00:00:00</div><div class="controls"><button class="primary" id="start">● Mulai Rekam</button><button class="secondary" id="pause" disabled>Jeda</button><button class="secondary" id="resume" disabled>Lanjutkan</button><button class="danger" id="stop" disabled>■ Stop</button></div><p id="message" class="notice">Izinkan akses mikrofon saat browser memintanya. Transkrip menggunakan speech recognition browser bila tersedia.</p></section><section class="card"><h2>Transkrip</h2><div class="field"><label for="title">Judul sesi</label><input id="title" placeholder="Contoh: Rapat koordinasi"></div><div class="field"><textarea id="text" class="transcript" placeholder="Transkrip akan muncul di sini..."></textarea></div><div class="controls"><button class="primary" id="save">Simpan transkrip</button><button class="secondary" id="copy">Salin</button><button class="secondary" id="download">Unduh TXT</button><button class="danger" id="clear">Bersihkan</button></div></section><section class="card"><h2>Riwayat Lite</h2><div id="history" class="muted">Belum ada sesi.</div></section></div><script src="/notulensi-lite-storage.js"></script><script src="/notulensi-lite.js"></script></body></html>
