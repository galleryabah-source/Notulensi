<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notulensi Lite — Rekap & Transkrip</title>
<meta name="description" content="Notulensi Lite untuk rekap rapat dan transkrip tanpa ketergantungan AI.">
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{font-weight:800;font-size:22px}.muted{color:#667085}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 6px 22px rgba(16,24,40,.05)}button,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:#172033;color:#fff}.secondary{background:#eef2f6;color:#172033}.nav button{width:100%;text-align:left;margin:4px 0;background:transparent}.nav button.active{background:#eef2f6;font-weight:700}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat strong{display:block;font-size:28px;margin-top:4px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field input,.field textarea{border:1px solid #d0d5dd;border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:180px;resize:vertical}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.item:hover{background:#f8fafc}.empty{padding:36px;text-align:center;color:#667085}.badge{display:inline-block;background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:12px}.admin{font-size:13px}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.stat,.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div><div class="brand">Notulensi Lite</div><div class="muted">Rekap & Transkrip — tanpa AI</div></div><div class="admin"><a href="/admin-login.html?next=%2Fadmin-settings.html">Admin</a></div></header>
<div class="grid">
<aside class="card nav"><button class="active" data-view="dashboard">Dashboard</button><button data-view="meetings">Rekap Rapat</button><button data-view="transcripts">Transkrip</button><button data-view="search">Pencarian</button></aside>
<main>
<section id="dashboard" class="view"><div class="stat"><div class="card"><span class="muted">Total rapat</span><strong id="meetingCount">0</strong></div><div class="card"><span class="muted">Transkrip</span><strong id="transcriptCount">0</strong></div><div class="card"><span class="muted">Mode</span><strong style="font-size:20px">Mandiri</strong></div></div><div class="card"><h2>Mulai cepat</h2><p class="muted">Versi Lite hanya menyediakan pencatatan, rekap, dan transkrip. Tidak memanggil endpoint AI.</p><div class="toolbar"><button class="primary" data-view="meetings">Buat rekap</button><button class="secondary" data-view="transcripts">Tambah transkrip</button></div></div></section>
<section id="meetings" class="view hidden"><div class="card"><div class="toolbar"><button class="primary" id="newMeeting">+ Rekap rapat</button></div><div id="meetingList"></div></div><div class="card hidden" id="meetingEditor"><h2>Rekap rapat</h2><div class="row"><label class="field">Judul<input id="mTitle"></label><label class="field">Tanggal<input id="mDate" type="date"></label></div><label class="field">Peserta<input id="mParticipants"></label><label class="field">Agenda<textarea id="mAgenda"></textarea></label><label class="field">Kesimpulan<textarea id="mSummary"></textarea></label><div class="toolbar"><button class="primary" id="saveMeeting">Simpan</button><button class="secondary" id="cancelMeeting">Batal</button></div></div></section>
<section id="transcripts" class="view hidden"><div class="card"><div class="toolbar"><button class="primary" id="newTranscript">+ Transkrip</button></div><div id="transcriptList"></div></div><div class="card hidden" id="transcriptEditor"><h2>Transkrip</h2><label class="field">Judul<input id="tTitle"></label><label class="field">Isi transkrip<textarea id="tBody"></textarea></label><div class="toolbar"><button class="primary" id="saveTranscript">Simpan</button><button class="secondary" id="cancelTranscript">Batal</button></div></div></section>
<section id="search" class="view hidden"><div class="card"><label class="field">Cari rapat atau transkrip<input id="searchBox" placeholder="Ketik kata kunci..."></label><div id="searchResults" class="empty">Masukkan kata kunci untuk mencari.</div></div></section>
</main></div>
</div>
<script src="/notulensi-lite-storage.js"></script>
<script src="/notulensi-lite.js"></script>
</body></html>
