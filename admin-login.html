<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin — Notulensi</title><style>body{margin:0;background:#020617;color:#e2e8f0;font:14px/1.5 Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,calc(100% - 32px));background:#0f172a;border:1px solid #334155;border-radius:18px;padding:22px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{margin:0;font-size:22px}p{color:#94a3b8;font-size:12px}.field{margin-top:14px}.field label{display:block;font-weight:700;font-size:11px;color:#cbd5e1;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #334155;border-radius:9px;background:#020617;color:#fff}.actions{display:flex;gap:8px;margin-top:16px}.btn{flex:1;padding:10px;border:1px solid #475569;border-radius:9px;background:#1e293b;color:#e2e8f0;cursor:pointer;font-weight:700}.primary{background:#2563eb;border-color:#3b82f6;color:#fff}.msg{margin-top:12px;font-size:11px}.ok{color:#86efac}.err{color:#fca5a5}.small{margin-top:12px;color:#64748b;font-size:10px}</style></head><body><main class="card"><h1>🔐 Login Admin</h1><p>Gunakan kredensial admin yang dikonfigurasi pada environment Vercel. Tidak ada password default di source code.</p><form id="form"><div class="field"><label>Email Admin</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><div class="actions"><button class="btn primary" type="submit">Masuk</button><button class="btn" type="button" id="check">Cek Sesi</button></div></form><div id="msg" class="msg"></div><div class="small">Role yang diterima: ADMIN atau SUPER_ADMIN.</div></main><script>const msg=document.getElementById('msg');function show(t,c=''){msg.textContent=t;msg.className='msg '+c}async function session(){try{const r=await fetch('/api/admin-session',{credentials:'include'});const d=await r.json();if(d.authenticated){show('Sesi admin aktif. Membuka pengaturan…','ok');location.href='./admin-settings.html'}else show('Belum login.')}catch(e){show('Gagal memeriksa sesi.','err')}}document.getElementById('check').onclick=session;document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();show('Memverifikasi…');try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login gagal');show('Login berhasil.','ok');setTimeout(()=>location.href='./admin-settings.html',250)}catch(e){show(e.message,'err')}});session();</script></body></html>
