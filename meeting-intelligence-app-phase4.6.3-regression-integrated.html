<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meeting Intelligence Ultimate — Phase 4.6.3 Regression</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}#appFrame{display:block;width:100%;height:100%;border:0;background:#020617}#bootStatus{position:fixed;right:14px;bottom:14px;z-index:9999;background:#0f172a;color:#cbd5e1;border:1px solid #334155;border-radius:10px;padding:8px 11px;font:12px system-ui,sans-serif}</style>
</head>
<body>
<div id="bootStatus">Memuat regression baseline…</div>
<iframe id="appFrame" title="Meeting Intelligence Ultimate Phase 4.6.3"></iframe>
<script>
(function(){'use strict';
const frame=document.getElementById('appFrame'),status=document.getElementById('bootStatus');
const base='./meeting-intelligence-app-phase4.2-document-versioning-traceability.html';
const scripts=['./phase4.2-runtime-fix.js','./phase4.3-document-pack-addon.js','./phase4.4-document-export-addon.js','./phase4.5-document-pack-ux.js','./phase4.6-document-governance.js','./phase4.6.1-governance-regression-hardening.js','./phase4.6.2-governance-enforcement.js','./phase4.6.3-governance-regression-matrix.js'];
function setStatus(t,hide){status.textContent=t;status.style.display=hide?'none':'block'}
function inject(src){return new Promise((resolve,reject)=>{const doc=frame.contentDocument;if(!doc||!doc.head)return reject(new Error('Dokumen iframe belum siap.'));if(doc.querySelector('script[data-phase-runtime="'+src+'"]'))return resolve();const s=doc.createElement('script');s.src=src;s.async=false;s.dataset.phaseRuntime=src;s.onload=resolve;s.onerror=()=>reject(new Error('Gagal memuat '+src));doc.head.appendChild(s)})}
async function boot(){try{for(let i=0;i<scripts.length;i++){setStatus('Mengaktifkan '+scripts[i]+'…');await inject(scripts[i])}setStatus('Phase 4.6.3 siap. Jalankan runPhase463GovernanceRegressionMatrix() di console.',false)}catch(e){console.error(e);setStatus('Bootstrap gagal: '+e.message,false)}}
frame.addEventListener('load',boot,{once:true});frame.src=base;
})();
</script>
</body>
</html>
