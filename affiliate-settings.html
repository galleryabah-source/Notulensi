<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Affiliate / Monetisasi — Notulensi</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;background:#020617;color:#e2e8f0;font:14px/1.5 system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:18px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{flex:1;min-width:280px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #475569;border-radius:9px;background:#020617;color:#fff}.btn{padding:10px 14px;border:1px solid #475569;border-radius:9px;background:#1e293b;color:#fff;cursor:pointer;font-weight:700}.primary{background:#2563eb}.danger{background:#991b1b}.muted{color:#94a3b8;font-size:12px}.status{margin-top:10px;font-size:12px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #334155;text-align:left;vertical-align:middle}th{font-size:11px;color:#94a3b8;text-transform:uppercase}td.url{max-width:430px;word-break:break-all;color:#93c5fd}.empty{text-align:center;padding:25px;color:#94a3b8}@media(max-width:700px){table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{border-bottom:1px solid #334155;padding:10px 0}td{border:0;padding:6px 0}td:before{content:attr(data-label);display:block;font-size:10px;color:#94a3b8;font-weight:700;text-transform:uppercase}}</style></head><body><main class="wrap"><div class="row" style="justify-content:space-between"><div><h1>💰 Affiliate / Monetisasi</h1><p class="muted">Halaman khusus untuk mengelola link affiliate. Pengaturan umum tidak terganggu.</p></div><div class="row"><button id="back" class="btn">← Pengaturan Umum</button><button id="logout" class="btn">Keluar</button></div></div><div class="card"><h2>🔗 Tambah Link Affiliate</h2><div class="row"><div class="field"><label>Link Affiliate</label><input id="url" type="url" placeholder="https://shope.ee/..." autocomplete="off"></div><button id="save" class="btn primary">💾 Simpan Link</button><button id="cancel" class="btn" hidden>Batal Edit</button></div><div id="status" class="status"></div></div><div class="card"><div class="row" style="justify-content:space-between"><div><h2>📋 Daftar Link Affiliate</h2><p class="muted">Satu link per baris. Gunakan Edit untuk mengganti link atau Hapus untuk menghapusnya dari server.</p></div><span id="count" class="muted">0 link</span></div><div style="overflow:auto"><table><thead><tr><th>#</th><th>Link Affiliate</th><th>Aksi</th></tr></thead><tbody id="list"></tbody></table></div></div></main><script>'use strict';const $=id=>document.getElementById(id);let config=null,editIndex=-1;const defaults={enabled:true,affiliate:{enabled:true,network:'Shopee Affiliate',disclosure:'Rekomendasi ini menggunakan tautan afiliasi Shopee.',defaultLabel:'Lihat di Shopee',items:[]},adsense:{enabled:false,publisherId:'',slots:{}},premium:{enabled:false,upgradeUrl:'',benefits:[]},privacy:{privacyUrl:'./privacy-policy.html',termsUrl:'./terms.html'}};function msg(t){$('status').textContent=t}function valid(url){try{const u=new URL(url);return /^https?:$/.test(u.protocol)}catch{return false}}async function load(){msg('⏳ Memuat link dari server…');const r=await fetch('/api/monetization-config',{credentials:'include',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Gagal memuat (${r.status})`);config=d.config||structuredClone(defaults);if(!config.affiliate)config.affiliate=structuredClone(defaults.affiliate);if(!Array.isArray(config.affiliate.items))config.affiliate.items=[];render();msg('✅ Data dimuat dari server.')}function render(){$('count').textContent=`${config.affiliate.items.length} link`;const body=$('list');body.innerHTML='';if(!config.affiliate.items.length){body.innerHTML='<tr><td colspan="3" class="empty">Belum ada link affiliate.</td></tr>';return}config.affiliate.items.forEach((x,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td data-label="#">${i+1}</td><td data-label="Link Affiliate" class="url"></td><td data-label="Aksi"><button class="btn" data-edit="${i}">Edit</button> <button class="btn danger" data-delete="${i}">Hapus</button></td>`;tr.querySelector('.url').textContent=x.url||'';body.appendChild(tr)});body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)));body.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(Number(b.dataset.delete)))}function edit(i){editIndex=i;$('url').value=config.affiliate.items[i]?.url||'';$('save').textContent='💾 Simpan Perubahan';$('cancel').hidden=false;$('url').focus();msg(`✏️ Mengedit link #${i+1}`)}function cancel(){editIndex=-1;$('url').value='';$('save').textContent='💾 Simpan Link';$('cancel').hidden=true;msg('Edit dibatalkan.')}async function persist(){const r=await fetch('/api/monetization-config',{method:'PUT',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify({config})});const d=await r.json().catch(()=>({}));if(!r.ok||d.saved!==true||d.verified!==true)throw Error(d.error||`Penyimpanan gagal (${r.status})`);config=d.config||config;render()}async function save(){const url=$('url').value.trim();if(!valid(url)){msg('❌ Masukkan URL lengkap yang valid, contoh https://shope.ee/...');return}const items=config.affiliate.items||[];if(editIndex>=0){items[editIndex].url=url}else{items.push({id:'affiliate-'+crypto.randomUUID(),title:'Affiliate Link',description:'',url,label:'Lihat di Shopee',category:'',categories:[],tags:[],weight:50,priority:0,frequencyCap:0,enabled:true})}$('save').disabled=true;try{await persist();msg(editIndex>=0?'✅ Link berhasil diperbarui di server.':'✅ Link berhasil disimpan di server.');cancel()}catch(e){msg('❌ '+e.message)}finally{$('save').disabled=false}}async function remove(i){if(!confirm('Hapus link affiliate ini dari server?'))return;const old=config.affiliate.items[i];config.affiliate.items.splice(i,1);try{await persist();msg('✅ Link berhasil dihapus dari server.')}catch(e){config.affiliate.items.splice(i,0,old);render();msg('❌ '+e.message)}}$('save').onclick=save;$('cancel').onclick=cancel;$('back').onclick=()=>location.href='/admin-settings.html';$('logout').onclick=async()=>{await fetch('/api/admin-logout',{method:'POST',credentials:'include'});location.href='/admin-login.html'};load().catch(e=>msg('❌ '+e.message));</script></body></html>
