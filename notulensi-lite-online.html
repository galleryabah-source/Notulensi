<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notulensi Lite — Rekam & Transkrip</title><meta name="description" content="Notulensi Lite — rekam rapat dan kelola transkrip di browser."><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin:16px 0}button{padding:10px 14px;border:0;border-radius:9px;margin:4px;cursor:pointer}.p{background:#172033;color:white}.muted{color:#667085}textarea,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd2da;border-radius:9px;margin:6px 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}audio{width:100%;margin-top:12px}.item{padding:12px;border:1px solid #e2e5e9;border-radius:10px;margin:8px 0}</style></head><body><div class="wrap"><h1>Notulensi Lite</h1><p class="muted">Rekam & Transkrip — versi ringan.</p><div class="card"><h2>Rekam</h2><div id="status">Siap merekam</div><strong id="timer">00:00</strong><div class="row"><button id="start" class="p">Mulai rekam</button><button id="stop" disabled>Berhenti</button><button id="save" disabled>Simpan audio</button></div><audio id="audio" controls class="hidden"></audio></div><div class="card"><h2>Transkrip</h2><input id="title" maxlength="160" placeholder="Judul transkrip"><textarea id="body" placeholder="Isi transkrip"></textarea><button id="add" class="p">Simpan transkrip</button><div id="list"></div></div></div><script>const $=id=>document.getElementById(id);let rec,stream,chunks=[],blob=null,startAt=0,timer;const KEY='notulensi-lite-online-transcripts';function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function render(){const a=load();$('list').innerHTML=a.length?a.map(x=>`<div class="item"><b>${esc(x.title)}</b><div>${esc(x.body).slice(0,300)}</div></div>`).join(''):'<p class="muted">Belum ada transkrip.</p>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60),r=s%60;return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}function finish(){blob=new Blob(chunks,{type:rec?.mimeType||'audio/webm'});stream?.getTracks().forEach(t=>t.stop());clearInterval(timer);$('audio').src=URL.createObjectURL(blob);$('audio').classList.remove('hidden');$('status').textContent='Rekaman siap';$('start').disabled=false;$('stop').disabled=true;$('save').disabled=false} $('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);startAt=Date.now();rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=finish;rec.start();$('status').textContent='Sedang merekam…';$('start').disabled=true;$('stop').disabled=false;$('save').disabled=true;timer=setInterval(()=>$('timer').textContent=fmt(Date.now()-startAt),250)}catch(e){$('status').textContent='Mikrofon tidak tersedia: '+e.message}};$('stop').onclick=()=>rec?.state==='recording'&&rec.stop();$('save').onclick=()=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='notulensi-lite-'+new Date().toISOString().replace(/[:.]/g,'-')+'.webm';a.click()};$('add').onclick=()=>{const title=$('title').value.trim(),body=$('body').value.trim();if(!title||!body)return alert('Judul dan isi transkrip wajib diisi.');const a=load();a.unshift({title,body,updatedAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(a));$('title').value='';$('body').value='';render()};render();</script></body></html>
