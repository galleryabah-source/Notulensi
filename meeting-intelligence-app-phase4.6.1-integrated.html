<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Meeting Intelligence Ultimate — Phase 4.6.2 Integrated</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}#appFrame{display:block;width:100%;height:100%;border:0;background:#020617}#bootStatus{position:fixed;right:14px;bottom:14px;z-index:9999;background:#0f172a;color:#cbd5e1;border:1px solid #334155;border-radius:10px;padding:8px 11px;font:12px system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)}#aiSettingsLauncher{position:fixed;left:14px;bottom:14px;z-index:10000;border:1px solid #334155;border-radius:12px;background:#4f46e5;color:#fff;padding:10px 14px;font:600 12px system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3)}#aiSettingsPanel{position:fixed;inset:0;z-index:10001;display:none;background:rgba(2,6,23,.82);backdrop-filter:blur(5px)}#aiSettingsPanel iframe{position:absolute;inset:4%;width:92%;height:92%;border:1px solid #334155;border-radius:18px;background:#020617;box-shadow:0 24px 80px rgba(0,0,0,.55)}#aiSettingsClose{position:absolute;right:4.8%;top:3%;z-index:2;border:1px solid #475569;border-radius:10px;background:#0f172a;color:#e2e8f0;padding:8px 11px;cursor:pointer}</style></head><body><div id="bootStatus">Memuat baseline…</div><button id="aiSettingsLauncher" type="button">⚙️ Pengaturan AI</button><div id="aiSettingsPanel" aria-hidden="true"><button id="aiSettingsClose" type="button">Tutup ✕</button><iframe id="aiSettingsFrame" title="Pengaturan AI"></iframe></div><iframe id="appFrame" title="Meeting Intelligence Ultimate"></iframe><script>(function(){'use strict';const frame=document.getElementById('appFrame'),status=document.getElementById('bootStatus'),panel=document.getElementById('aiSettingsPanel'),settingsFrame=document.getElementById('aiSettingsFrame'),launcher=document.getElementById('aiSettingsLauncher'),close=document.getElementById('aiSettingsClose');const base='./meeting-intelligence-app-phase4.2-document-versioning-traceability.html';const scripts=['./phase4.2-runtime-fix.js','./phase4.3-document-pack-addon.js','./phase4.4-document-export-addon.js','./phase4.5-document-pack-ux.js','./phase4.6-document-governance.js','./phase4.6.1-governance-regression-hardening.js','./phase4.6.2-governance-enforcement.js','./phase-ui-navigation-windows11.js','./ai-runtime-bridge.js','./phase-ai-provider-compat.js','./phase-ai-fallback.js'];function setStatus(t,h){status.textContent=t;status.style.display=h?'none':'block'}function openAiSettings(){settingsFrame.src='./ai-settings-v2.html';panel.style.display='block';panel.setAttribute('aria-hidden','false')}function closeAiSettings(){panel.style.display='none';panel.setAttribute('aria-hidden','true')}launcher.addEventListener('click',openAiSettings);close.addEventListener('click',closeAiSettings);panel.addEventListener('click',e=>{if(e.target===panel)closeAiSettings()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeAiSettings()});window.addEventListener('message',function(e){if(e.data&&e.data.type==='meeting-ai-settings-updated'&&frame.contentWindow){try{frame.contentWindow.postMessage(e.data,location.origin)}catch(err){}}});function inject(src){return new Promise((resolve,reject)=>{const doc=frame.contentDocument;if(!doc||!doc.head)return reject(new Error('Dokumen iframe belum siap.'));if(doc.querySelector('script[data-phase-runtime="'+src+'"]'))return resolve();const s=doc.createElement('script');s.src=src;s.async=false;s.dataset.phaseRuntime=src;s.onload=resolve;s.onerror=()=>reject(new Error('Gagal memuat '+src));doc.head.appendChild(s)})}async function boot(){try{const labels=['Phase 4.2','Document Pack','Export Engine','Phase 4.5 UX','Governance','Regression Guard','Governance Enforcement','Windows 11 Navigation','AI Runtime Bridge','AI Provider Compatibility','AI Fallback Router'];for(let i=0;i<scripts.length;i++){setStatus((i===0?'Baseline dimuat — mengaktifkan ':labels[i-1]+' aktif — mengaktifkan ')+labels[i]+'…');await inject(scripts[i])}try{frame.contentWindow.openSettingsModal=openAiSettings}catch(e){}setStatus('Meeting Intelligence Ultimate Phase 4.6.2 siap.',true)}catch(e){console.error(e);setStatus('Bootstrap gagal: '+e.message)}}frame.addEventListener('load',boot,{once:true});frame.src=base})()</script></body></html>
