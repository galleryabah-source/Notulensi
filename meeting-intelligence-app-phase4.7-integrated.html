<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Meeting Intelligence Ultimate — Phase 4.7</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}#appFrame{width:100%;height:100%;border:0;display:block}#boot{position:fixed;right:14px;bottom:14px;z-index:9;background:#0f172a;color:#cbd5e1;border:1px solid #334155;border-radius:10px;padding:8px 11px;font:12px system-ui,sans-serif}</style></head><body><div id="boot">Memuat Phase 4.7…</div><iframe id="appFrame" title="Meeting Intelligence Ultimate"></iframe><script>(async function(){const f=document.getElementById('appFrame'),b=document.getElementById('boot');const base='./meeting-intelligence-app-phase4.2-document-versioning-traceability.html';const files=['./phase4.2-runtime-fix.js','./phase4.3-document-pack-addon.js','./phase4.4-document-export-addon.js','./phase4.5-document-pack-ux.js','./phase4.6-document-pack-integrity-addon.js','./phase4.7-document-pack-lifecycle-addon.js'];function add(src){return new Promise((ok,no)=>{const d=f.contentDocument,s=d.createElement('script');s.src=src;s.async=false;s.onload=ok;s.onerror=()=>no(new Error(src));d.head.appendChild(s)})}f.onload=async()=>{try{for(const x of files){b.textContent='Mengaktifkan '+x.replace('./','');await add(x)}b.remove()}catch(e){b.textContent='Bootstrap gagal: '+e.message;console.error(e)}};f.src=base})();</script></body></html>
