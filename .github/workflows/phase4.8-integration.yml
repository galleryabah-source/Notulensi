name: Phase 4.8 Integration Security Test

on:
  push:
    branches:
      - phase4.8-production-cloud-backend
  pull_request:
    branches:
      - main
      - phase4.8-production-cloud-backend

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meeting_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meeting_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meeting_intelligence_test
      JWT_SECRET: integration-test-jwt-secret-01234567890123456789
      SHARE_TOKEN_PEPPER: integration-test-share-pepper-01234567890123456789
      DATABASE_SSL: 'false'
      CORS_ORIGIN: http://127.0.0.1:3000
      RESOLVE_RATE_LIMIT: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: node --check test/integration.test.js
      - run: node --test test/integration.test.js
