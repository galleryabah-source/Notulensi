name: Notulensi Self-Host Smoke

on:
  push:
    branches:
      - fix/lite-solid-core
  pull_request:
    branches:
      - main
    paths:
      - 'server/self-host.mjs'
      - 'tests/self-host-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/self-host-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: node --check server/self-host.mjs
      - name: Runtime smoke test
        run: node tests/self-host-smoke.mjs
