name: Notulensi Lite Regression

on:
  push:
    branches:
      - fix/lite-function-count
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lite-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine audit
        run: node tests/notulensi-lite-engine-audit.mjs
      - name: Runtime contract
        run: node tests/lite-runtime-contract.mjs
      - name: Browser readiness
        run: node tests/lite-browser-readiness.mjs
