name: Phase 17-E Production Readiness Evidence

on:
  push:
    branches:
      - phase17-execution-evidence
      - phase17-r2.1-database-runtime
  pull_request:
    branches:
      - phase17-execution-evidence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase17-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Static validation and evidence collection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase17_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d phase17_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      EVIDENCE_OUTPUT: ${{ github.workspace }}/phase17-execution/evidence-report.json
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: phase17_test

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Git identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CI_COMMIT=$actual"
          test "$actual" = "${GITHUB_SHA}"

      - name: Validate Phase 17 JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(phase17*.js phase17-execution/*.mjs)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          psql --version
          pg_isready --host "$PGHOST" --port "$PGPORT" --username "$PGUSER" --dbname "$PGDATABASE"

      - name: Execute real database runtime harness
        shell: bash
        continue-on-error: true
        run: |
          node phase17-execution/database-runtime-harness.mjs

      - name: Execute ephemeral application runtime health harness
        shell: bash
        continue-on-error: true
        run: |
          node phase17-execution/runtime-health-harness.mjs

      - name: Run evidence collector
        shell: bash
        continue-on-error: true
        run: |
          node phase17-execution/evidence-collector.mjs

      - name: Run fail-closed readiness aggregation
        shell: bash
        run: |
          set +e
          node phase17-execution/readiness-aggregator.mjs > phase17-execution/readiness-result.json
          status=$?
          set -e
          cat phase17-execution/readiness-result.json
          # NO-GO is an expected evidence outcome while required runtime domains remain absent.
          # The CI job remains successful so the evidence artifact can be inspected.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Classify blockers
        shell: bash
        run: |
          set +e
          node phase17-execution/blocker-classifier.mjs > phase17-execution/blockers.json
          status=$?
          set -e
          cat phase17-execution/blockers.json
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

      - name: Upload Phase 17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-evidence-${{ github.sha }}
          path: |
            phase17-execution/runtime-health.json
            phase17-execution/database-runtime.json
            phase17-execution/evidence-report.json
            phase17-execution/readiness-result.json
            phase17-execution/blockers.json
          if-no-files-found: error
          retention-days: 14
